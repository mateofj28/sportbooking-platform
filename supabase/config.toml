# Supabase project configuration
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "olrmhtimfndshayvuowc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://sportbooking-platform.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # false en dev; true en producción

# ============================================================
# SCHEDULED EDGE FUNCTIONS (cron jobs)
# schedule: expresión cron en UTC
# ============================================================

[functions.cron-cancel-unpaid]
verify_jwt = false  # llamada interna del scheduler de Supabase
[functions.cron-cancel-unpaid.cron]
schedule = "0 * * * *"   # cada hora en el minuto 0

[functions.cron-send-reminders]
verify_jwt = false
[functions.cron-send-reminders.cron]
schedule = "*/10 * * * *"  # cada 10 minutos

[functions.cron-complete-bookings]
verify_jwt = false
[functions.cron-complete-bookings.cron]
schedule = "30 * * * *"  # cada hora en el minuto 30
